<body class="bg-[#1a1721] text-[#f2eef8] flex items-center justify-center min-h-screen p-0 m-0 overflow-hidden select-none">

e-linecap="round" stroke-width="2.5"></path><g transform="rotate(-20 220 318)"><rect fill="#171320" height="34" rx="3" stroke="#d2f000" stroke-width="2" width="8" x="216" y="298"></rect><circle cx="220" cy="303" fill="#d2f000" r="1.8"></circle></g><!-- Vision cone from camera to face --><polygon fill="url(#beamGrad)" points="216,314 116,268 110,306"></polygon><path d="M 216 314 L 116 268" stroke="#d2f000" stroke-dasharray="3 3" stroke-linecap="round" stroke-width="1.5"></path><path d="M 216 314 L 110 306" stroke="#d2f000" stroke-dasharray="3 3" stroke-linecap="round" stroke-width="1.5"></path><!-- Lime Badge 2 --><g transform="translate(244, 280)"><circle cx="0" cy="0" fill="#d2f000" r="11"></circle><text fill="#292333" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="0" y="4.5">2</text></g></g><!-- Vertical Sub-divider between Mini-scenes --><line stroke="#3b334a" stroke-dasharray="3 3" stroke-width="1.5" x1="320" x2="320" y1="216" y2="394"></line><!-- Bottom Right Mini-Scene (Badge 3: Front Phone Screen Face Alignment Guide) --><g id="mini-scene-face-alignment" transform="translate(350, 222)"><rect fill="#171320" filter="url(#subtleGlow)" height="145" rx="16" stroke="#d2f000" stroke-width="2" width="190" x="20" y="16"></rect><!-- Notch / Speaker bar --><rect fill="#383046" height="4" rx="2" width="46" x="92" y="22"></rect><!-- Corner Crop Brackets (Viewfinder) --><path d="M 46 48 L 38 48 L 38 56" stroke="#d2f000" stroke-linecap="round" stroke-width="2"></path><path d="M 184 48 L 192 48 L 192 56" stroke="#d2f000" stroke-linecap="round" stroke-width="2"></path><path d="M 38 120 L 38 128 L 46 128" stroke="#d2f000" stroke-linecap="round" stroke-width="2"></path><path d="M 192 120 L 192 128 L 184 128" stroke="#d2f000" stroke-linecap="round" stroke-width="2"></path><!-- Driver Head / Face --><ellipse cx="115" cy="88" fill="#282234" rx="36" ry="38" stroke="#e8e2f4" stroke-width="2"></ellipse><!-- Two cute lime round eyes (Brand style) --><circle cx="102" cy="84" fill="none" r="5.5" stroke="#d2f000" stroke-width="2"></circle><circle cx="102" cy="84" fill="#d2f000" r="2.5"></circle><circle cx="128" cy="84" fill="none" r="5.5" stroke="#d2f000" stroke-width="2"></circle><circle cx="128" cy="84" fill="#d2f000" r="2.5"></circle><!-- Glasses bridge --><path d="M 108 83 Q 115 80 122 83" stroke="#d2f000" stroke-linecap="round" stroke-width="1.5"></path><!-- Sweet pink smile curve --><path d="M 108 102 Q 115 110 122 102" stroke="#ff9cc5" stroke-linecap="round" stroke-width="2.5"></path><!-- Green checkmark badge top-right of viewfinder --><circle cx="182" cy="42" fill="#d2f000" r="10"></circle><path d="M 178 42 L 181 45 L 186 39" stroke="#292333" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path><!-- Lime Badge 3 --><g transform="translate(216, 16)"><circle cx="0" cy="0" fill="#d2f000" r="11"></circle><text fill="#292333" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle" x="0" y="4.5">3</text></g></g></svg></div>
<!-- 3 Short Numbered Labels (Within / Below Diagram) -->
<div class="space-y-1.5 my-2"><div class="flex items-center gap-2.5 bg-[#211b2b] px-3 py-2 rounded-xl border border-white/5"><span class="w-5 h-5 rounded-full bg-[#d2f000] text-[#292333] font-bold text-[11px] flex items-center justify-center flex-shrink-0">1</span><p class="text-[13px] font-medium text-white/90">핸들 앞쪽 또는 오른쪽에 고정</p></div><div class="flex items-center gap-2.5 bg-[#211b2b] px-3 py-2 rounded-xl border border-white/5"><span class="w-5 h-5 rounded-full bg-[#d2f000] text-[#292333] font-bold text-[11px] flex items-center justify-center flex-shrink-0">2</span><p class="text-[13px] font-medium text-white/90">카메라 각도는 얼굴 쪽으로</p></div><div class="flex items-center gap-2.5 bg-[#211b2b] px-3 py-2 rounded-xl border border-white/5"><span class="w-5 h-5 rounded-full bg-[#d2f000] text-[#292333] font-bold text-[11px] flex items-center justify-center flex-shrink-0">3</span><p class="text-[13px] font-medium text-white/90">두 눈과 얼굴 전체가 보이게</p></div></div>

<div class="flex items-start gap-1.5 px-2 py-1.5 mt-1 text-center justify-center"><span class="text-[#ff9cc5] text-xs">💡</span><p class="text-[11.5px] text-[#ff9cc5]/90 font-medium">도로 시야와 계기판을 가리지 않게 설치해요.</p></div>

      </p>
